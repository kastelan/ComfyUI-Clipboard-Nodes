name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PyGObject's GTK bindings come from the system package manager, not
      # pip — installing via apt (rather than actions/setup-python + pip)
      # keeps `import gi` working without building PyGObject from source.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 xvfb

      - name: Install Python test dependencies
        run: pip install -e --break-system-packages pytest numpy pillow

      - name: Run tests
        run: xvfb-run -a python3 -m pytest tests/ -v --ignore=__init__.py
