[pytest]
# clipboard_backend.py and nodes.py live at the repo root (ComfyUI custom
# node layout), not in a package — add root to sys.path so `import nodes`
# and `import clipboard_backend` work from tests/.
pythonpath = .
testpaths = tests

# The repo root also has its own __init__.py (the one ComfyUI loads:
# `from .nodes import NODE_CLASS_MAPPINGS, ...`). Because pytest.ini lives
# in that same directory, pytest wraps the whole run in a <Package> node
# for the repo root and imports that __init__.py as part of collection —
# which fails outside a real ComfyUI install, since its relative import
# has no parent package to resolve against. --import-mode=importlib avoids
# needing __init__.py for module naming, and --confcutdir=tests stops
# pytest's package/conftest boundary walk at tests/ so it never wraps the
# repo root in a Package in the first place.
addopts = --import-mode=importlib --confcutdir=tests
